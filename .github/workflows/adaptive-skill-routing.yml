name: adaptive-skill-routing

on:
  workflow_dispatch:
  push:
    branches:
      - "adaptive-skill-routing"
    paths:
      - "codex-adaptive-skill-routing/**"
      - ".github/workflows/adaptive-skill-routing.yml"
  pull_request:
    paths:
      - "codex-adaptive-skill-routing/**"
      - ".github/workflows/adaptive-skill-routing.yml"

permissions:
  contents: read

concurrency:
  group: adaptive-skill-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch project
        uses: actions/checkout@v4

      - name: Check out pinned Codex baseline
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: c7a4a7e136d96554e1fc6f66532e6060fd2aaf15
          path: codex

      - name: Apply patch series
        run: |
          git -C codex config user.name "adaptive-skill-routing-ci"
          git -C codex config user.email "adaptive-skill-routing-ci@users.noreply.github.com"
          for patch in codex-adaptive-skill-routing/patches/*.patch; do
            git -C codex am "../$patch"
          done

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex/codex-rs/target
          key: uasr-${{ runner.os }}-${{ hashFiles('codex/rust-toolchain.toml', 'codex/codex-rs/Cargo.lock') }}

      - name: Verify
        working-directory: codex
        run: bash ../codex-adaptive-skill-routing/scripts/verify.sh

      - name: Save Rust build cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex/codex-rs/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
