name: Compare remote coding MCP candidates
on:
  workflow_dispatch:
  push:
    branches:
      - experiments/chatgpt-workspace-qualification

permissions:
  contents: read

jobs:
  local-shell-mcp:
    name: local-shell-mcp pinned regression and independent probe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone and pin external candidate read only
        run: |
          git clone --filter=blob:none https://github.com/fwerkor/local-shell-mcp.git /tmp/candidate-local-shell-mcp
          cd /tmp/candidate-local-shell-mcp
          git checkout --detach dec01b9f50f966097ddfc84d357d12a52f238935
          test "$(git rev-parse HEAD)" = dec01b9f50f966097ddfc84d357d12a52f238935
      - name: Install into runner only
        run: |
          python -m pip install --disable-pip-version-check -e '/tmp/candidate-local-shell-mcp[dev]'
      - name: Upstream targeted regression
        working-directory: /tmp/candidate-local-shell-mcp
        run: |
          python -m pytest -q \
            tests/test_mcp_chatgpt_compat.py \
            tests/test_oauth_complete.py \
            tests/test_skill_tools.py \
            tests/test_job_mutation_recovery.py \
            tests/test_tool_security_edge_cases.py \
            --junitxml=/tmp/local-shell-regression.xml
      - name: Independent candidate check on disposable files
        env:
          REPORT_PATH: /tmp/candidate-fwerkor.json
        run: |
          python research/chatgpt-workspace-qualification/candidate_fwerkor.py
      - name: Validate restricted OAuth MCP profile
        if: success()
        run: |
          python research/chatgpt-workspace-qualification/candidate_fwerkor_oauth.py \
            research/chatgpt-workspace-qualification/local-shell-mcp.env.example
      - name: Real OAuth PKCE MCP and process-restart E2E
        if: success()
        env:
          E2E_REPORT: /tmp/public-real-process-e2e.json
        run: |
          python research/chatgpt-workspace-qualification/real_process_oauth_e2e.py
      - name: Require recovery of a running job after MCP OS restart
        if: success()
        env:
          JOB_RESTART_REPORT: /tmp/public-job-restart.json
        run: |
          python research/chatgpt-workspace-qualification/real_job_restart_e2e.py
      - name: Validate Public-only staged deployment files (no deployment)
        if: success()
        run: |
          python research/chatgpt-workspace-qualification/deploy/validate_staging.py
      - name: Security gate - authenticated shell must not read server OAuth secrets
        if: success()
        env:
          SECURITY_REPORT: /tmp/public-credential-boundary.json
        run: |
          python research/chatgpt-workspace-qualification/deploy/credential_boundary.py
      - name: Security gate - OAuth controller and remote worker must use separate Linux users
        if: success()
        env:
          DUAL_UID_REPORT: /tmp/public-dual-uid.json
        run: |
          python research/chatgpt-workspace-qualification/deploy/dual_identity_e2e.py
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-fwerkor-evidence
          path: |
            /tmp/candidate-fwerkor.json
            /tmp/candidate-fwerkor-oauth.json
            /tmp/public-real-process-e2e.json
            /tmp/public-job-restart.json
            /tmp/public-credential-boundary.json
            /tmp/public-dual-uid.json
            /tmp/local-shell-regression.xml
          retention-days: 14
          if-no-files-found: warn

  staged-linux-host:
    name: staging installer qualifies on disposable Ubuntu (NO service activation)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout ONLY Public qualification branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static staged-package contract
        run: |
          python3 research/chatgpt-workspace-qualification/deploy/validate_staging.py
      - name: Static Codespaces bootstrap syntax and no-live-deploy contract
        run: |
          bash -n research/chatgpt-workspace-qualification/deploy/codespaces-stage.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path('research/chatgpt-workspace-qualification/deploy/codespaces-stage.sh').read_text()
          assert 'dec01b9f50f966097ddfc84d357d12a52f238935' in s
          assert 'candidate_fwerkor.py' in s
          assert 'NO_PUBLIC_ENDPOINT' in s
          assert '[[ "$(id -un)" == codespace ]]' in s
          assert 'git -C "$ROOT" status --porcelain' in s
          for banned in ('systemctl start','systemctl enable','gh codespace ports visibility','docker run', 'sudo bash'):
              assert banned not in s,banned
          print('PASS: Codespaces bootstrap is syntax-valid and staging-only')
          PY
      - name: Verify Codespaces dual-UID staging and OAuth-only startup contracts
        run: |
          bash -n research/chatgpt-workspace-qualification/deploy/codespaces-isolated-stage.sh
          bash -n research/chatgpt-workspace-qualification/deploy/codespaces-start-controller.sh
          bash -n research/chatgpt-workspace-qualification/deploy/codespaces-qualify-partial.sh
          python3 -m py_compile research/chatgpt-workspace-qualification/deploy/codespaces-diagnose-controller.py
          python3 -m py_compile research/chatgpt-workspace-qualification/deploy/codespaces-repair-runtime.py
          python3 -m py_compile research/chatgpt-workspace-qualification/deploy/codespaces-enroll-verify-worker.py
          python3 -m py_compile research/chatgpt-workspace-qualification/deploy/tests/test_codespaces_runtime_permissions.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('research/chatgpt-workspace-qualification/deploy')
          stage=(root/'codespaces-isolated-stage.sh').read_text()
          launch=(root/'codespaces-start-controller.sh').read_text()
          for required in ('useradd --system --user-group','runuser -u "$WORKER"','no-push://disabled',
                           'LOCAL_SHELL_MCP_DISABLE_LOCAL=true','LOCAL_SHELL_MCP_AUTH_MODE=oauth',
                           'LOCAL_SHELL_MCP_AUTH_BYPASS_LOCALHOST=false',
                           'LOCAL_SHELL_MCP_OAUTH_JWT_SECRET=$JWT_SECRET',
                           'HOST_NOT_EXPOSED'):
              assert required in stage,required
          for required in ('LOCAL_CONTROLLER_GATE_PASS','PORT_VISIBILITY_UNCHANGED',
                           'LOCAL_SHELL_MCP_AUTH_MODE=oauth','LOCAL_SHELL_MCP_DISABLE_LOCAL=true',
                           'http_code" == 401','nondumpable_mcp_entrypoint.py',
                           'CONTROLLER_ONLY'):
              assert required in launch,required
          for required in ('SYSTEM_PY=/usr/bin/python3','"$SYSTEM_PY" -m venv "$probe"',
                           '"$SYSTEM_PY" -m venv "$RUNTIME/venv"',
                           '"$RUNTIME/venv/bin/python" -m pip install'):
              assert required in stage,required
          assert 'uv executable not located' not in stage
          assert '"$UV" python install' not in stage
          assert 'umask 022' in stage
          assert 'controller cannot import staged root-owned Python runtime' in stage
          assert 'worker cannot import staged root-owned Python runtime' in stage
          assert 'codespaces-repair-runtime.py' in launch
          assert 'controller cannot import backend runtime' in launch
          assert stage.index('"$SYSTEM_PY" -m venv "$probe"') < stage.index('useradd --system --user-group')
          for banned in ('gh codespace ports visibility','systemctl start','systemctl enable','docker run'):
              assert banned not in stage and banned not in launch,banned
          assert 'remote_worker' not in launch
          recovery=(root/'codespaces-qualify-partial.sh').read_text()
          for required in ('setfacl -m "u:$WORKER:---" "$REPO"',
                           'getfacl -p "$REPO" > "$backup"',
                           'PARTIAL_STAGE_RECOVERED_PASS',
                           'HOST_NOT_EXPOSED', 'runuser -u "$WORKER" -- test ! -x "$REPO"',
                           'runuser -u "$WORKER" -- test ! -w "$REPO"',
                           'codespaces-isolation-qualified',
                           'runuser -u "$WORKER" -- test ! -r "$socket"'):
              assert required in recovery,required
          attest=(root/'codespaces-enroll-verify-worker.py').read_text()
          for required in ('LOCAL_OAUTH_PKCE_PASS', 'LOCAL_MCP_CONTROL_PLANE_PASS',
                           'WORKER_ENROLLMENT_AND_REMOTE_SHELL_PASS',
                           'PORT_VISIBILITY_UNCHANGED', 'NO_GIT_WRITES_NO_SECRETS_PRINTED',
                           'LOCAL_SHELL_MCP_AUTH_MODE": "none"',
                           'spawn_worker(invite)', 'start_new_session=True',
                           'os.killpg(p.pid, signal.SIGTERM)',
                           'oauth-token',):
              if required == 'oauth-token':
                  assert '"/oauth/token"' in attest
              else:
                  assert required in attest,required
          assert '--invite-stdin' in attest and '--invite", ' not in attest
          assert 'https://' in attest and 'app.github.dev' in attest
          assert 'WORKER_PROCESS_PID' in attest
          assert 'remote_manage' in attest and 'run_shell' in attest
          assert 'gh codespace ports visibility' not in attest
          assert 'git push' not in attest
          assert 'codespaces-isolation-qualified' in launch
          assert 'worker can traverse original Codespaces checkout' in launch
          assert 'worker can write to original Codespaces checkout' in launch
          print('PASS: Codespaces staged two-UID security contract, partial recovery, and OAuth controller-only startup')
          PY
      - name: Exercise worker-deny ACL on disposable Ubuntu fixture
        run: |
          set -euo pipefail
          if ! command -v setfacl >/dev/null || ! command -v getfacl >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y acl
          fi
          user="public-acl-ci-probe"
          sudo useradd --system --user-group "$user"
          fixture="$(mktemp -d /tmp/public-acl-ci.XXXXXXXX)"
          sudo chown "$USER:$USER" "$fixture"
          chmod 0777 "$fixture"
          sudo -u "$user" test -w "$fixture"
          sudo -u "$user" test -x "$fixture"
          sudo setfacl -m "u:$user:---" "$fixture"
          ! sudo -u "$user" test -w "$fixture"
          ! sudo -u "$user" test -x "$fixture"
          ! sudo -u "$user" test -r "$fixture"
          test -w "$fixture"
          sudo userdel "$user"
          rm -rf -- "$fixture"
          echo "PASS: targeted Linux ACL denies low-privilege worker without disabling workspace owner"

      - name: Exercise restricted-umask runtime repair and unsafe symlink refusal
        run: |
          sudo python3 research/chatgpt-workspace-qualification/deploy/tests/test_codespaces_runtime_permissions.py
      - name: Execute installer on EPHEMERAL GitHub-hosted Ubuntu
        run: |
          sudo bash research/chatgpt-workspace-qualification/deploy/install-staged.sh
      - name: Verify exact users, permissions, staged units, single repo, no services started
        run: |
          test "$(id -un "$(id -u chatgpt-controller)")" = chatgpt-controller
          test "$(id -un "$(id -u chatgpt-worker)")" = chatgpt-worker
          test "$(id -u chatgpt-controller)" != "$(id -u chatgpt-worker)"
          test "$(sudo stat -c '%U:%a' /srv/chatgpt-controller/state)" = "chatgpt-controller:700"
          test "$(sudo stat -c '%U:%a' /srv/chatgpt-worker/state)" = "chatgpt-worker:700"
          test "$(sudo stat -c '%U:%a' /etc/chatgpt-coder/controller.env)" = "root:600"
          test "$(sudo stat -c '%U:%a' /etc/chatgpt-coder/worker.env)" = "root:600"
          ! sudo grep -Eq '^(LOCAL_SHELL_MCP_OAUTH_|.*JWT_SECRET=|.*ADMIN_PIN=)' /etc/chatgpt-coder/worker.env
          sudo grep -qx 'LOCAL_SHELL_MCP_DISABLE_LOCAL=true' /etc/chatgpt-coder/controller.env
          sudo grep -qx 'LOCAL_SHELL_MCP_REMOTE_ENABLED=true' /etc/chatgpt-coder/controller.env
          sudo -u chatgpt-worker git -C /srv/chatgpt-worker/worktrees/Public status --porcelain
          test "$(sudo -u chatgpt-worker git -C /srv/chatgpt-worker/git/Public remote get-url --push origin)" = "no-push://disabled"
          test "$(sudo git -C /opt/chatgpt-coder/source rev-parse HEAD)" = dec01b9f50f966097ddfc84d357d12a52f238935
          test "$(sudo systemctl is-enabled chatgpt-coder.service)" = disabled
          test "$(sudo systemctl is-enabled chatgpt-worker.service)" = disabled
          ! sudo systemctl is-active --quiet chatgpt-coder.service
          ! sudo systemctl is-active --quiet chatgpt-worker.service
          test ! -e /srv/chatgpt-controller/git/Public
          ! sudo -u chatgpt-worker test -r /srv/chatgpt-controller/state
          ! sudo -u chatgpt-worker test -r /etc/chatgpt-coder/controller.env
          echo "PASS ephemeral-only staged install: controller/worker are separate, Public-only, services disabled."
      - name: Prove installer refuses active service without changing staged files
        run: |
          set -euo pipefail
          snapshot() {
            sudo sha256sum /etc/systemd/system/chatgpt-coder.service /etc/systemd/system/chatgpt-worker.service /etc/chatgpt-coder/controller.env /etc/chatgpt-coder/worker.env
          }
          snapshot > /tmp/pre-active-refusal.sha
          mkdir -p /tmp/active-service-shim
          cat > /tmp/active-service-shim/systemctl <<'SH'
          #!/usr/bin/env bash
          if [[ "$1" == "is-active" && "$2" == "--quiet" && "$3" == "chatgpt-coder.service" ]]; then
            exit 0
          fi
          exec /usr/bin/systemctl "$@"
          SH
          chmod 755 /tmp/active-service-shim/systemctl
          if sudo env PATH="/tmp/active-service-shim:$PATH" bash research/chatgpt-workspace-qualification/deploy/install-staged.sh > /tmp/refusal.out 2>&1; then
            echo "FAIL: installer accepted active service" >&2
            exit 1
          fi
          grep -Fq 'Refusing staged installation while chatgpt-coder.service is running' /tmp/refusal.out
          snapshot > /tmp/post-active-refusal.sha
          diff -u /tmp/pre-active-refusal.sha /tmp/post-active-refusal.sha
          echo "PASS: active controller causes refusal and staged service/config hashes remain unchanged."

  chatgpt-local-coder:
    name: chatgpt-local-coder upstream tests and unsafe-default assessment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone and pin external candidate read only
        run: |
          git clone --filter=blob:none https://github.com/hoangcoderr/chatgpt-local-coder.git /tmp/candidate-local-coder
          cd /tmp/candidate-local-coder
          git checkout --detach bc2ce5e6cb12fac20633065fb122fabbbb5c98c3
          test "$(git rev-parse HEAD)" = bc2ce5e6cb12fac20633065fb122fabbbb5c98c3
      - name: Install/build pinned backend
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          cd /tmp/candidate-local-coder
          pnpm install --frozen-lockfile
          pnpm build
      - name: Run upstream tests on disposable runner
        working-directory: /tmp/candidate-local-coder
        run: |
          pnpm test
      - name: Independently classify default security boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/candidate-local-coder')
          p=(root/'src/lib/permissions.ts').read_text()
          q=(root/'src/lib/path-security.ts').read_text()
          open_default='return "open";' in p and 'return true;' in p and 'return path.resolve(trimmed);' in q
          report={'candidate':'hoangcoderr/chatgpt-local-coder','pin':'bc2ce5e6cb12fac20633065fb122fabbbb5c98c3',
                  'open_access_by_default':open_default,'production_candidate':False if open_default else 'unverified'}
          Path('/tmp/chatgpt-local-coder-security.json').write_text(json.dumps(report,indent=2)+'\n')
          assert open_default, 'Source changed: re-review permission controls before use'
          print(report)
          PY
      - name: Retain security finding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-local-coder-evidence
          path: /tmp/chatgpt-local-coder-security.json
          retention-days: 14
          if-no-files-found: warn
